<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation - Weather / MapTiler API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .profile-info {
            margin-bottom: 20px;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 15px;
        }

        .profile-info h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #2a5298;
        }

        .search-box button {
            padding: 12px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #1e3c72;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #2a5298;
        }

        .result-item span.label {
            font-weight: 600;
            color: #555;
            text-transform: capitalize;
        }

        .result-item span.value {
            color: #111;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            color: #d9534f;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-info">
            <h3>Nama : <span id="nama-mhs">Achmad Fadjar Mufasirin</span></h3>
            <h3>NIM  : <span id="nim-mhs">20240140186</span></h3>
        </div>

        <div class="search-box">
            <input type="text" id="input-lokasi" placeholder="Masukkan nama lokasi/kota..." value="Yogyakarta">
            <button onclick="cariLokasi()">Cari</button>
        </div>

        <div class="results" id="output-container">
            <div class="result-item">
                <span class="label">Negara:</span>
                <span class="value" id="negara">-</span>
            </div>
            <div class="result-item">
                <span class="label">Provinsi:</span>
                <span class="value" id="provinsi">-</span>
            </div>
            <div class="result-item">
                <span class="label">Kecamatan:</span>
                <span class="value" id="kecamatan">-</span>
            </div>
            <div class="result-item">
                <span class="label">Longitude:</span>
                <span class="value" id="longitude">-</span>
            </div>
            <div class="result-item">
                <span class="label">Latitude:</span>
                <span class="value" id="latitude">-</span>
            </div>
        </div>
    </div>

<script>
    const MAPTILER_API_KEY = "fgLH5YQBcNpNd9UqYxtL";

    async function cariLokasi() {
        const query = document.getElementById("input-lokasi").value.trim();
        if (!query) return alert("Silakan masukkan nama lokasi!");

        const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(query)}.json?key=${MAPTILER_API_KEY}`;

        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            console.log("Data dari API:", data);

            if (data.features && data.features.length > 0) {
                const feature = data.features[0];
                const context = feature.context || [];

                const [lng, lat] = feature.geometry.coordinates;

                let country = "-";
                let province = "-";
                let district = "-";

                context.forEach(item => {
                    if (item.id.includes("country")) country = item.text;
                    if (item.id.includes("region") || item.id.includes("province")) province = item.text;
                    if (item.id.includes("subregion") || item.id.includes("district") || item.id.includes("locality")) district = item.text;
                });

                if (district === "-" && feature.text) {
                    district = feature.text;
                }

                document.getElementById("negara").innerText = country;
                document.getElementById("provinsi").innerText = province;
                document.getElementById("kecamatan").innerText = district;
                document.getElementById("longitude").innerText = lng;
                document.getElementById("latitude").innerText = lat;
            } else {
                alert("Lokasi tidak ditemukan!");
            }
        } catch (error) {
            console.error("Error fetching data:", error);
            alert("Gagal mengambil data dari API.");
        }
    }


    window.onload = cariLokasi;
</script>

</body>
</html>
